name: Embedding Experiment

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout for the experiment'
        required: false
        default: 'main'

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only the runtime deps needed for embeddings to keep job fast
          python -m pip install --no-cache-dir sentence-transformers pypdf numpy
      - name: Run embedding example
        run: |
          python backend/embedding_example.py --input-dir dataset/textos --out-dir backend/output
      - name: Upload embeddings
        uses: actions/upload-artifact@v4
        with:
          name: embeddings-output
          path: backend/output
