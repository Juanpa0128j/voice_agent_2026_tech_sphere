<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Console - Knowledge</title>
</head>
<body>
  <h1>Admin Console (Knowledge)</h1>
  <p>Upload a PDF to add to the knowledge base (this is a demo UI; server endpoints must be implemented).</p>
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="file" name="file" accept="application/pdf" />
    <button>Upload</button>
  </form>
  <div id="status"></div>
  <script>
    document.getElementById('uploadForm').onsubmit = async (e) => {
      e.preventDefault()
      const f = e.target.file.files[0]
      if (!f) return
      const fd = new FormData()
      fd.append('file', f)
      document.getElementById('status').textContent = 'Uploading... (demo only)'
      try {
        const res = await fetch('/admin/upload', {method:'POST', body: fd})
        const j = await res.json()
        document.getElementById('status').textContent = 'Uploaded: ' + JSON.stringify(j)
      } catch (err) {
        document.getElementById('status').textContent = 'Error (no backend implemented in demo environment)'
      }
    }
  </script>
</body>
</html>
